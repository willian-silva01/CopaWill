version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: copa-will-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - copa-will-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copa-will-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - copa-will-network

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: copa-will-api
    restart: always
    env_file:
      - ../apps/api/.env
    networks:
      - copa-will-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: copa-will-web
    restart: always
    env_file:
      - ../apps/web/.env.local
    networks:
      - copa-will-network
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: copa-will-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - copa-will-network
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:

networks:
  copa-will-network:
    driver: bridge
