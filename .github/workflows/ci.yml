name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────
  # Lint e Build do Frontend
  # ──────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ──────────────────────────────────────────
  # Testes e Build do Backend
  # ──────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: copawill_test
          POSTGRES_USER: copawill
          POSTGRES_PASSWORD: copawill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm --filter api prisma:generate
        env:
          DATABASE_URL: postgresql://copawill:copawill@localhost:5432/copawill_test

      - name: Executar migrations
        run: pnpm --filter api prisma migrate deploy
        env:
          DATABASE_URL: postgresql://copawill:copawill@localhost:5432/copawill_test

      - name: Testes unitários
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://copawill:copawill@localhost:5432/copawill_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-only
          REFRESH_TOKEN_SECRET: test-refresh-secret-ci
          JWT_EXPIRES_IN: 15m
          REFRESH_TOKEN_EXPIRES_IN: 30d

      - name: Build
        run: pnpm --filter api build
